name: Build APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y git zip unzip openjdk-17-jdk python3-pip python3-setuptools autoconf libtool pkg-config zlib1g-dev libncurses5-dev libncursesw5-dev libtinfo5 cmake libffi-dev libssl-dev ccache liblzma-dev gfortran python3-dev build-essential
          pip install --upgrade pip
          pip install --upgrade buildozer cython==0.29.33 setuptools

      - name: Build APK with Buildozer
        # Bắt buộc đồng ý license và buộc dùng các phiên bản công cụ cụ thể
        run: |
          buildozer -v android debug --accept-sdk-license

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: UngDungCuaToi-APK
          path: bin/*.apk
